[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panel-next"
version = "0.1.0"
description = "Lightweight Ollama CLI for planning the next storyboard panel from a base image."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "panel-next contributors" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[project.scripts]
panel-next = "panel_next.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
